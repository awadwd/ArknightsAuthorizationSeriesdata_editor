name: Sync KnowCloud Data (Direct)

# 这条 workflow 是"兜底"通道：不依赖任何人的浏览器，直接把知晓云数据落进仓库。
# 真正的定时主力是 Cloudflare Worker 的 cron（见 server/wrangler.toml 的 [triggers]），
# 因为 GitHub Actions 的 schedule 在低活跃仓库上会被推迟到 4~6 小时一次。
#
# 相关 secret（可选，不配也能跑）：
#   CF_DEPLOY_HOOK —— Cloudflare Pages 的 Deploy Hook URL。
#                     配了它，push 之后会立刻触发 Pages 重建，
#                     避免"仓库已更新、线上还是旧数据"。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# 同一时间只跑一个，避免两轮同时写同一个文件
concurrency:
  group: sync-knowcloud
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: none
      statuses: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch KnowCloud tables and generate kc-data.js
        id: fetch
        run: node scripts/sync-knowcloud.mjs

      - name: Check diff
        id: diff
        run: |
          git diff --stat functions/api/kc-data.js
          CHANGED=$(git diff --name-only functions/api/kc-data.js)
          if [ -z "$CHANGED" ]; then
            echo "No changes to kc-data.js — skipping commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (only if changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/api/kc-data.js
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore: sync kc-data from KnowCloud $TIMESTAMP"
          git push
          echo "Pushed. CF Pages will rebuild automatically."

      # 显式触发 Pages 重建：有些项目的 Pages 并不监听 bot 的 push，
      # 或者生产分支不是 master，这一步能把"已部署但没重建"的坑堵住。
      - name: Trigger Pages deploy hook
        if: steps.diff.outputs.changed == 'true' && secrets.CF_DEPLOY_HOOK != ''
        run: |
          curl -sS -X POST "${{ secrets.CF_DEPLOY_HOOK }}" -o /dev/null -w "deploy hook: %{http_code}\n"
