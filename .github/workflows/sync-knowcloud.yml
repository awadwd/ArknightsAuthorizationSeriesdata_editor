name: Sync KnowCloud Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      pages_host:
        description: 'Pages dev hostname, no scheme (e.g. xxx.pages.dev)'
        required: false
        default: 'arknightsauthorizationsseriesdata-editor.pages.dev'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve via DoH (multi-provider, A+AAAA) and call sync API
        run: |
          set -uo pipefail
          HOST="${{ github.event.inputs.pages_host }}"
          echo "Target host: $HOST"
          A_IPS=""; AAAA_IPS=""
          for PROV in "1.1.1.1|https://1.1.1.1/dns-query" "8.8.8.8|https://8.8.8.8/resolve"; do
            IP="${PROV%%|*}"; URL="${PROV##*|}"
            echo "--- DoH provider $IP ---"
            R=$(curl -sS --resolve "$IP:443:$IP" -H "accept: application/dns-json" "$URL?name=$HOST&type=A" 2>/dev/null) || true
            S=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('Status'))" 2>/dev/null||true)
            echo "  A Status=$S"
            if [ "$S" = "0" ]; then
              A_IPS=$(echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(a['data'] for a in d.get('Answer',[]) if a.get('type')==1))" 2>/dev/null || true)
            fi
            R=$(curl -sS --resolve "$IP:443:$IP" -H "accept: application/dns-json" "$URL?name=$HOST&type=AAAA" 2>/dev/null) || true
            S=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('Status'))" 2>/dev/null||true)
            echo "  AAAA Status=$S"
            if [ "$S" = "0" ]; then
              AAAA_IPS=$(echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(a['data'] for a in d.get('Answer',[]) if a.get('type')==28))" 2>/dev/null || true)
            fi
            echo "  A(IPv4)='$A_IPS' AAAA(IPv6)='$AAAA_IPS'"
            if [ -n "$A_IPS" ] || [ -n "$AAAA_IPS" ]; then
              echo "  Got records from $IP, stop."
              break
            fi
          done
          RESOLVE_ARGS=""
          for ip in $A_IPS; do RESOLVE_ARGS="$RESOLVE_ARGS --resolve $HOST:443:$ip"; done
          for ip in $AAAA_IPS; do RESOLVE_ARGS="$RESOLVE_ARGS --resolve $HOST:443:[$ip]"; done
          if [ -z "$RESOLVE_ARGS" ]; then
            echo "::error::No A/AAAA records for $HOST from any DoH provider"
            exit 1
          fi
          echo "resolve args:$RESOLVE_ARGS"
          echo "Token length: ${#ADMIN_TOKEN}"
          if [ "${#ADMIN_TOKEN}" -lt 10 ]; then
            echo "::error::ADMIN_TOKEN secret appears unset or too short (length=${#ADMIN_TOKEN})"
            exit 1
          fi
          RESP=$(curl $RESOLVE_ARGS --retry 3 --retry-delay 10 --retry-connrefused \
            --connect-timeout 15 --max-time 120 \
            -sS -w "\n__HTTP_CODE__=%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://$HOST/api/admin/sync")
          BODY=$(echo "$RESP" | sed '$d')
          HTTP_CODE=$(echo "$RESP" | tail -n1 | sed 's/.*=//')
          echo "HTTP_CODE=$HTTP_CODE"
          echo "BODY=$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::sync failed http=$HTTP_CODE"
            exit 1
          fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}