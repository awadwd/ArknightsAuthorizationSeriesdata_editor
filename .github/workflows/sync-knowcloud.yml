name: Sync KnowCloud Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      pages_host:
        description: 'Pages dev hostname, no scheme (e.g. xxx.pages.dev)'
        required: false
        default: 'arknightsauthorizationsseriesdata-editor.pages.dev'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve host via DoH (bypass broken runner DNS)
        id: resolve
        run: |
          set -uo pipefail
          HOST="${{ github.event.inputs.pages_host }}"
          echo "Target host: $HOST"
          echo "Step1: try system getent"
          IP=$(getent hosts "$HOST" 2>/dev/null | awk '{print $1}' | head -1) || true
          echo "  getent -> '$IP'"
          if [ -z "$IP" ]; then
            echo "Step2: try DoH via 1.1.1.1 (HTTPS, hardcoded IP, avoids UDP/53 block)"
            DOH_RESP=$(curl -sS --resolve 1.1.1.1:443:1.1.1.1 -H "accept: application/dns-json" "https://1.1.1.1/dns-query?name=$HOST&type=A" 2>/dev/null) || true
            echo "  DoH resp: $(echo "$DOH_RESP" | head -c 400)"
            echo "  DoH Status: $(echo "$DOH_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('Status'))" 2>/dev/null || true)"
            IP=$(echo "$DOH_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['Answer'][0]['data'])" 2>/dev/null || true)
            echo "  DoH IP -> '$IP'"
          fi
          if [ -z "$IP" ]; then
            echo "Step3: try dig @1.1.1.1 (fallback)"
            IP=$(dig +short +time=5 +tries=2 "$HOST" @1.1.1.1 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1) || true
            echo "  dig@1.1.1.1 -> '$IP'"
          fi
          if [ -z "$IP" ]; then
            echo "::error::Failed to resolve $HOST (NXDOMAIN or no egress). Check the exact Pages URL in Cloudflare Dashboard."
            exit 1
          fi
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "Resolved $HOST -> $IP"
      - name: Call sync API
        run: |
          set -uo pipefail
          HOST="${{ steps.resolve.outputs.host }}"
          IP="${{ steps.resolve.outputs.ip }}"
          URL="https://$HOST/api/admin/sync"
          echo "Posting to $URL via $IP"
          echo "Token length: ${#ADMIN_TOKEN}"
          if [ "${#ADMIN_TOKEN}" -lt 10 ]; then
            echo "::error::ADMIN_TOKEN secret appears unset or too short (length=${#ADMIN_TOKEN})"
            exit 1
          fi
          RESP=$(curl --resolve "$HOST:443:$IP" --retry 3 --retry-delay 10 --retry-connrefused \
            --connect-timeout 15 --max-time 120 \
            -sS -w "\n__HTTP_CODE__=%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            "$URL")
          BODY=$(echo "$RESP" | sed '$d')
          HTTP_CODE=$(echo "$RESP" | tail -n1 | sed 's/.*=//')
          echo "HTTP_CODE=$HTTP_CODE"
          echo "BODY=$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::sync failed http=$HTTP_CODE"
            exit 1
          fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}