name: Sync KnowCloud Data

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点
  workflow_dispatch:       # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync API
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://arknightsauthorizationsseriesdata-editor.pages.dev/api/admin/sync"
