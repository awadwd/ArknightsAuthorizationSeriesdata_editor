name: Sync KnowCloud Data (Direct)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: none
      statuses: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch KnowCloud tables and generate kc-data.js
        id: fetch
        run: |
          node -e "
          const https = require('https');
          const KC_TABLES = [
            'Version', 'choearth_notice', 'more_notice', 'questionnaire',
            'SearchWord_Version', 'Guess_Version', 'AiToolsConfig'
          ];
          const CLIENT_ID = '21680db9b1362913357c';
          const BASE_URL = '21680db9b1362913357c.myminapp.com';
          const LIMIT = 200;

          function fetchTable(table) {
            return new Promise((resolve, reject) => {
              const opts = {
                hostname: BASE_URL,
                path: '/hserve/v2.2/table/' + table + '/record/?limit=' + LIMIT,
                method: 'GET',
                headers: {
                  'X-Hydrogen-Client-ID': CLIENT_ID,
                  'User-Agent': 'sync-workflow/1.0'
                }
              };
              const req = https.request(opts, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    resolve({ table, objects: json.objects || [] });
                  } catch(e) { reject(new Error('Parse error for ' + table + ': ' + e.message)); }
                });
              });
              req.on('error', reject);
              req.setTimeout(15000, () => { req.destroy(); reject(new Error('Timeout: ' + table)); });
              req.end();
            });
          }

          async function main() {
            const results = {};
            for (const t of KC_TABLES) {
              process.stdout.write('Fetching ' + t + '... ');
              try {
                const r = await fetchTable(t);
                results[t] = r.objects;
                console.log('OK (' + r.objects.length + ' records)');
              } catch(e) {
                console.error('FAIL: ' + e.message);
                process.exit(1);
              }
            }

            // Build HANDLERS template
            const handlers = KC_TABLES.map(t =>
              '    ' + JSON.stringify(t) + ': ' + JSON.stringify(results[t])
            ).join(',\n');

            const kcData = '// Auto-generated. Do not edit manually.\n' +
              '// Generated at: ' + new Date().toISOString() + '\n\n' +
              'const HANDLERS = {\n' + handlers + '\n};\n\n' +
              'module.exports = { HANDLERS };';

            require('fs').writeFileSync(
              'functions/api/kc-data.js',
              kcData, 'utf8'
            );
            console.log('\\nkc-data.js written. Size:', kcData.length, 'bytes');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Check diff
        id: diff
        run: |
          git diff --stat functions/api/kc-data.js
          CHANGED=$(git diff --name-only functions/api/kc-data.js)
          if [ -z "$CHANGED" ]; then
            echo "No changes to kc-data.js — skipping commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (only if changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/api/kc-data.js
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore: sync kc-data from KnowCloud $TIMESTAMP"
          git push
          echo "Pushed. CF Pages will rebuild automatically."
