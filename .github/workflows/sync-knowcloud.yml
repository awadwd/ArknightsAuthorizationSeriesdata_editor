name: Sync KnowCloud Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve host (with DNS fallback)
        id: resolve
        run: |
          set -euo pipefail
          HOST="arknightsauthorizationsseriesdata-editor.pages.dev"
          if ! command -v dig >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          fi
          IP=$(dig +short +time=5 +tries=2 "$HOST" @1.1.1.1 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$IP" ]; then
            IP=$(dig +short +time=5 +tries=2 "$HOST" @8.8.8.8 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          fi
          if [ -z "$IP" ]; then
            echo "::error::Failed to resolve $HOST via 1.1.1.1 and 8.8.8.8"
            exit 1
          fi
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "Resolved $HOST -> $IP"
      - name: Call sync API
        run: |
          set -euo pipefail
          HOST="${{ steps.resolve.outputs.host }}"
          IP="${{ steps.resolve.outputs.ip }}"
          URL="https://$HOST/api/admin/sync"
          echo "Posting to $URL via $IP"
          echo "Token length: ${#ADMIN_TOKEN}"
          if [ "${#ADMIN_TOKEN}" -lt 10 ]; then
            echo "::error::ADMIN_TOKEN secret appears unset or too short (length=${#ADMIN_TOKEN})"
            exit 1
          fi
          RESP=$(curl --resolve "$HOST:443:$IP" --retry 3 --retry-delay 10 --retry-connrefused \
            --connect-timeout 15 --max-time 120 \
            -sS -w "\n__HTTP_CODE__=%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            "$URL")
          BODY=$(echo "$RESP" | sed '$d')
          HTTP_CODE=$(echo "$RESP" | tail -n1 | sed 's/.*=//')
          echo "HTTP_CODE=$HTTP_CODE"
          echo "BODY=$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::sync failed http=$HTTP_CODE"
            exit 1
          fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}