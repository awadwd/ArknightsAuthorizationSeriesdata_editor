name: Sync KnowCloud Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS + reachability pre-check
        run: |
          set -euo pipefail
          HOST="arknightsauthorizationsseriesdata-editor.pages.dev"
          echo "Resolving $HOST ..."
          getent hosts "$HOST" || nslookup "$HOST" || true
          curl -sS --connect-timeout 10 -o /dev/null -w "precheck http=%{http_code} time=%{time_total}\n" \
            "https://$HOST/api/auth/status" || echo "precheck failed (continuing)"
      - name: Call sync API
        run: |
          set -euo pipefail
          URL="https://arknightsauthorizationsseriesdata-editor.pages.dev/api/admin/sync"
          echo "Posting to $URL"
          echo "Token length: ${#ADMIN_TOKEN}"
          RESP=$(curl --retry 3 --retry-delay 10 --retry-connrefused \
            --connect-timeout 15 --max-time 120 \
            -sS -w "\n__HTTP_CODE__=%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            "$URL")
          BODY=$(echo "$RESP" | sed '$d')
          HTTP_CODE=$(echo "$RESP" | tail -n1 | sed 's/.*=//')
          echo "HTTP_CODE=$HTTP_CODE"
          echo "BODY=$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::sync failed http=$HTTP_CODE"
            exit 1
          fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}