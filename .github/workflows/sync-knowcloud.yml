name: Sync KnowCloud Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      pages_host:
        description: 'Pages dev hostname, no scheme (e.g. xxx.pages.dev)'
        required: false
        default: 'arknightsauthorizationsseriesdata-editor.pages.dev'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve via DoH (A + AAAA) and call sync API
        run: |
          set -uo pipefail
          HOST="${{ github.event.inputs.pages_host }}"
          echo "Target host: $HOST"
          # DoH for A (IPv4)
          A_RESP=$(curl -sS --resolve 1.1.1.1:443:1.1.1.1 -H "accept: application/dns-json" "https://1.1.1.1/dns-query?name=$HOST&type=A" 2>/dev/null) || true
          A_IPS=$(echo "$A_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(a['data'] for a in d.get('Answer',[]) if a.get('type')==1))" 2>/dev/null || true)
          echo "A(IPv4): '$A_IPS' Status=$(echo "$A_RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('Status'))" 2>/dev/null||true)"
          # DoH for AAAA (IPv6)
          AAAA_RESP=$(curl -sS --resolve 1.1.1.1:443:1.1.1.1 -H "accept: application/dns-json" "https://1.1.1.1/dns-query?name=$HOST&type=AAAA" 2>/dev/null) || true
          AAAA_IPS=$(echo "$AAAA_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(a['data'] for a in d.get('Answer',[]) if a.get('type')==28))" 2>/dev/null || true)
          echo "AAAA(IPv6): '$AAAA_IPS' Status=$(echo "$AAAA_RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('Status'))" 2>/dev/null||true)"
          RESOLVE_ARGS=""
          for ip in $A_IPS; do RESOLVE_ARGS="$RESOLVE_ARGS --resolve $HOST:443:$ip"; done
          for ip in $AAAA_IPS; do RESOLVE_ARGS="$RESOLVE_ARGS --resolve $HOST:443:[$ip]"; done
          if [ -z "$RESOLVE_ARGS" ]; then
            echo "::error::No A/AAAA records for $HOST"
            exit 1
          fi
          echo "resolve args:$RESOLVE_ARGS"
          echo "Token length: ${#ADMIN_TOKEN}"
          if [ "${#ADMIN_TOKEN}" -lt 10 ]; then
            echo "::error::ADMIN_TOKEN secret appears unset or too short (length=${#ADMIN_TOKEN})"
            exit 1
          fi
          RESP=$(curl $RESOLVE_ARGS --retry 3 --retry-delay 10 --retry-connrefused \
            --connect-timeout 15 --max-time 120 \
            -sS -w "\n__HTTP_CODE__=%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://$HOST/api/admin/sync")
          BODY=$(echo "$RESP" | sed '$d')
          HTTP_CODE=$(echo "$RESP" | tail -n1 | sed 's/.*=//')
          echo "HTTP_CODE=$HTTP_CODE"
          echo "BODY=$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::sync failed http=$HTTP_CODE"
            exit 1
          fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}