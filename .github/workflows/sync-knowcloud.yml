name: Sync KnowCloud Data (Direct)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: none
      statuses: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch KnowCloud tables and generate kc-data.js
        id: fetch
        run: node scripts/sync-knowcloud.mjs

      - name: Check diff
        id: diff
        run: |
          git diff --stat functions/api/kc-data.js
          CHANGED=$(git diff --name-only functions/api/kc-data.js)
          if [ -z "$CHANGED" ]; then
            echo "No changes to kc-data.js — skipping commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (only if changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/api/kc-data.js
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore: sync kc-data from KnowCloud $TIMESTAMP"
          git push
          echo "Pushed. CF Pages will rebuild automatically."
